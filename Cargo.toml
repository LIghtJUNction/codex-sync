[package]
name = "codex-sync"
version = "0.2.3"
edition = "2024"
description = "Sync and merge Codex conversations across computers, LAN, SSH, and offline storage"
license = "MIT"
repository = "https://github.com/LIghtJUNction/codex-sync"
homepage = "https://github.com/LIghtJUNction/codex-sync"
readme = "README.md"
keywords = ["codex", "sync", "backup", "lan", "cli"]
exclude = [".agents/**"]

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
walkdir = "2"
