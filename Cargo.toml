[package]
name = "codex-sync"
version = "0.1.0"
edition = "2024"
description = "Sync Codex conversations and configuration across computers on a LAN"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
walkdir = "2"

