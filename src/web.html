<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Codex Sync</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0b1020;color:#e8ecf4}body{max-width:900px;margin:48px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}.card{background:#151c31;border:1px solid #29334f;border-radius:14px;padding:20px;margin:16px 0}button{background:#6d5dfc;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#98a3ba}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #29334f}code{color:#86e1fc}input{background:#0b1020;border:1px solid #29334f;border-radius:8px;color:#e8ecf4;padding:10px;width:min(420px,100%)}
</style></head><body><header><div><h1>Codex Sync</h1><p class="muted">局域网聊天记录与配置同步</p></div><button onclick="refresh()">刷新</button></header><section class="card"><label>共享密钥<br><input id="key" type="password" autocomplete="off" placeholder="仅保存在此浏览器会话中" oninput="sessionStorage.key=this.value"></label></section><section class="card" id="status">输入共享密钥后刷新。</section><section class="card"><h2>局域网节点</h2><div id="peers">等待认证…</div></section><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=document.querySelector('#key');key.value=sessionStorage.key||'';const options=()=>({headers:{authorization:`Bearer ${key.value}`}});async function checked(url,init={}){let r=await fetch(url,{...init,headers:{...options().headers,...init.headers}});if(!r.ok)throw new Error(await r.text()||`HTTP ${r.status}`);return r}async function refresh(){if(!key.value)return;try{let s=await checked('/api/status').then(r=>r.json());document.querySelector('#status').innerHTML=`<b>${esc(s.node_name)}</b><p><code>${s.files.length}</code> 个同步文件</p>`;let ps=await checked('/api/peers').then(r=>r.json());document.querySelector('#peers').innerHTML=ps.length?`<table><tr><th>名称</th><th>地址</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td><code>${esc(p.address)}</code></td><td><button onclick="pull('${encodeURIComponent(p.address)}')">拉取</button></td></tr>`).join('')}</table>`:'<p class="muted">暂未发现其他节点。请确认它们正在运行且位于同一局域网。</p>'}catch(e){document.querySelector('#status').textContent=`请求失败：${e.message}`}}async function pull(peer){if(!confirm('从该节点拉取？有冲突的文件会另存副本。'))return;let r=await checked('/api/pull',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({peer:decodeURIComponent(peer)})});alert(JSON.stringify(await r.json()));refresh()}
</script></body></html>
